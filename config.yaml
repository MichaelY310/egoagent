root_environment_path: /home/tiger/.environment
harness_template_repository: /home/tiger/egoagent/harness
identity_repository: /home/tiger/egoagent/identity
registry_path: ~/.egoagent_registry.json

# prompt 中最多显示多少个 tool 和 knowledge（identity自身+当前环境的前N个）
max_prompt_tools: 10
max_prompt_knowledges: 5

command_blacklist:
  - rm -rf /
  - rm -rf /*
  - mkfs
  - dd if=/dev
  - :(){ :|:& };:
  - chmod -R 777 /
  - shutdown
  - reboot
  - init 0
  - init 6
  - kill -9 1
  - pkill -9
  - format
