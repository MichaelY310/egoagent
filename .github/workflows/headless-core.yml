name: Core boundary and frontend

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core-without-ui:
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python-only test dependencies
        run: python -m pip install -r requirements-core.txt "pytest>=9,<10"
      - name: Check imports, compatibility and API without frontend
        run: python -m pytest tests/test_core_separation.py -q -p no:cacheprovider
      - name: Export without frontend or server
        run: python scripts/export_core.py --output ../egoagent-core --with-tests
      - name: Exercise runtime in the isolated source distribution
        run: python -I ../egoagent-core/scripts/verify_headless.py --tests

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: harness_editor/package-lock.json
      - name: Install locked frontend dependencies
        run: npm --prefix harness_editor ci
      - name: Check native Chat and Workbench contracts
        run: node --test tests/*.test.cjs
      - name: Typecheck and build Workbench
        run: npm --prefix harness_editor run build
